<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaiburr Task Manager</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Kaiburr Task Manager</h1>

    <!-- Task Form -->
    <div class="card mb-4">
        <div class="card-header">Add / Update Task</div>
        <div class="card-body">
            <form id="taskForm">
                <input type="hidden" id="taskId">
                <div class="mb-3">
                    <label for="taskName" class="form-label">Task Name</label>
                    <input type="text" class="form-control" id="taskName" required>
                </div>
                <div class="mb-3">
                    <label for="taskOwner" class="form-label">Owner</label>
                    <input type="text" class="form-control" id="taskOwner" required>
                </div>
                <div class="mb-3">
                    <label for="taskCommand" class="form-label">Shell Command</label>
                    <input type="text" class="form-control" id="taskCommand" required>
                </div>
                <button type="submit" class="btn btn-primary">Save Task</button>
                <button type="button" class="btn btn-secondary" onclick="resetForm()">Reset</button>
            </form>
        </div>
    </div>

    <!-- Tasks Table -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            Tasks
            <button class="btn btn-success btn-sm" onclick="loadTasks()">Refresh</button>
        </div>
        <div class="card-body">
            <table class="table table-bordered table-striped" id="tasksTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Owner</th>
                        <th>Command</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Tasks will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Run Task Output Modal -->
<div class="modal fade" id="runOutputModal" tabindex="-1" aria-labelledby="runOutputModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="runOutputModalLabel">Task Output</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <pre id="runOutputContent" style="white-space: pre-wrap;"></pre>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
const API_BASE = "http://localhost:8080/tasks"; // Adjust if needed

// Load tasks into table
async function loadTasks() {
    const response = await fetch(API_BASE);
    const tasks = await response.json();
    const tbody = document.querySelector("#tasksTable tbody");
    tbody.innerHTML = "";
    tasks.forEach(task => {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${task.id}</td>
            <td>${task.name}</td>
            <td>${task.owner}</td>
            <td>${task.command}</td>
            <td>
                <button class="btn btn-info btn-sm" onclick='editTask(${JSON.stringify(task)})'>Edit</button>
                <button class="btn btn-danger btn-sm" onclick="deleteTask('${task.id}')">Delete</button>
                <button class="btn btn-warning btn-sm" onclick="runTask('${task.id}')">Run</button>
            </td>
        `;
        tbody.appendChild(row);
    });
}

// Add or Update Task
document.getElementById("taskForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = document.getElementById("taskId").value;
    const taskData = {
        name: document.getElementById("taskName").value,
        owner: document.getElementById("taskOwner").value,
        command: document.getElementById("taskCommand").value
    };

    if (id) {
        await fetch(`${API_BASE}/${id}`, {
            method: "PUT",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(taskData)
        });
    } else {
        await fetch(API_BASE, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(taskData)
        });
    }

    resetForm();
    loadTasks();
});

// Edit task: populate form
function editTask(task) {
    document.getElementById("taskId").value = task.id;
    document.getElementById("taskName").value = task.name;
    document.getElementById("taskOwner").value = task.owner;
    document.getElementById("taskCommand").value = task.command;
}

// Delete task
async function deleteTask(id) {
    if (confirm("Are you sure you want to delete this task?")) {
        await fetch(`${API_BASE}/${id}`, { method: "DELETE" });
        loadTasks();
    }
}

// Run task and show output in modal
async function runTask(id) {
    const response = await fetch(`${API_BASE}/${id}/run`, { method: "POST" });
    const result = await response.json();
    document.getElementById("runOutputContent").textContent = result.output || "No output.";
    const modal = new bootstrap.Modal(document.getElementById('runOutputModal'));
    modal.show();
}

// Reset form
function resetForm() {
    document.getElementById("taskId").value = "";
    document.getElementById("taskForm").reset();
}

// Initial load
loadTasks();
</script>
</body>
</html>
